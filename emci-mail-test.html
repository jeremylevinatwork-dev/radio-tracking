<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>EMCI mail test</title></head>
<body style="font-family:Arial,sans-serif;padding:20px">
<h2>EMCI email-format test</h2>
<p>Tap the button once. It sends ONE test email to jeremylevinatwork@gmail.com with the form as HTML.</p>
<button id="send" style="font-size:18px;padding:12px 20px">Send test email</button>
<pre id="out" style="margin-top:16px;white-space:pre-wrap"></pre>
<script>
var EJ_KEY="YCkjMTWq2fP_OHNis", EJ_SERVICE="service_ylmlcxh", EJ_TEMPLATE="template_kocoa4d";
var FORM_HTML = '<div style="font-family:Georgia,serif;color:#000;max-width:640px">'
+ '<div style="text-align:center;font-weight:bold;font-size:20px">EMCI Radio Repair Request Form</div>'
+ '<div style="text-align:center;letter-spacing:4px;font-size:12px;margin-bottom:10px">LOEWS HOTELS</div>'
+ '<table style="width:100%;border-collapse:collapse;font-size:14px"><tr>'
+ '<td style="padding:4px 0">Hotel/Property: <span style="border-bottom:1px solid #000;padding:0 6px">Lakewood</span></td>'
+ '<td>Manager\u2019s Name (Printed): <span style="border-bottom:1px solid #000;padding:0 6px">Test Manager</span></td></tr>'
+ '<tr><td style="padding:4px 0">Department: <span style="border-bottom:1px solid #000;padding:0 6px">Security</span></td>'
+ '<td>Manager\u2019s Signature: <span style="border-bottom:1px solid #000;padding:0 6px;min-width:110px;display:inline-block"><span style="font-family:\'Brush Script MT\',\'Segoe Script\',cursive;font-size:19px">Test Manager</span></span></td></tr></table>'
+ '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px"><tr><td>\u2611 1. Radio Model R7</td><td>(Reason for Repair) Does not Receive</td></tr></table>'
+ '<div style="font-size:12px;margin-top:10px">If this email shows a neat little form with lines and a script signature, HTML works. If it shows raw code with angle brackets, it does not.</div>'
+ '</div>';
document.getElementById("send").addEventListener("click", function(){
  var out = document.getElementById("out");
  out.textContent = "Sending...";
  fetch("https://api.emailjs.com/api/v1.0/email/send", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ service_id: EJ_SERVICE, template_id: EJ_TEMPLATE, user_id: EJ_KEY,
      template_params: { to_email: "jeremylevinatwork@gmail.com", subject: "EMCI form HTML test - check the formatting", body: FORM_HTML, message: FORM_HTML } }) })
  .then(function(r){ return r.text().then(function(t){ out.textContent = "EmailJS replied HTTP " + r.status + ": " + t; }); })
  .catch(function(e){ out.textContent = "Fetch failed: " + e.message; });
});
</script>
</body>
</html>
